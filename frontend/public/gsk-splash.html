<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSK — Augmentin Case Simulation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1030;
    --ink:#2b3550;
    --purple-1:#8B3DAB;
    --purple-2:#6B2D8B;
    --purple-3:#5B1D7B;
  }
  body{font-family:'Poppins',system-ui,sans-serif;}

  .page-bg{
    background:
      radial-gradient(70% 55% at -5% 108%, rgba(107,45,139,.15) 0%, rgba(155,91,190,.07) 45%, rgba(255,255,255,0) 78%),
      linear-gradient(160deg,#fefdfc 0%, #fdfbfa 55%, #fdfaf8 100%);
    background-attachment: fixed;
  }

  /* fades the photo's left edge into the page so there is no visible seam */
  .hero-img{
    -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 5%, #000 17%);
            mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 5%, #000 17%);
  }

  .eyebrow{letter-spacing:.20em;}

  .btn-start{
    background:linear-gradient(118deg, var(--purple-1) 0%, var(--purple-2) 48%, var(--purple-3) 100%);
    box-shadow:0 16px 36px rgba(107,45,139,.30);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-start:hover{transform:translateY(-2px); box-shadow:0 22px 46px rgba(107,45,139,.38);}
  .btn-start:hover .arw{transform:translateX(6px);}
  .btn-start:focus-visible{outline:3px solid var(--navy); outline-offset:4px;}
  .arw{transition:transform .2s ease;}
  @media (prefers-reduced-motion:reduce){.btn-start,.arw{transition:none;}}

  /* thin warm line-work across the bottom-left, sitting BELOW the button */
  .waves path{fill:none;stroke:#f3b391;stroke-width:1.2;opacity:.75;}
</style>
</head>
<body class="min-h-screen page-bg overflow-x-hidden">

<div class="relative min-h-screen flex flex-col lg:flex-row">

  <!-- ================= LEFT ================= -->
  <div class="relative z-10 flex-1 min-w-0 flex flex-col
              px-8 sm:px-12 lg:pl-[5.4%] lg:pr-10 pt-[4.6vh] pb-[4vh]">

    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:2rem;font-weight:900;letter-spacing:0.04em;color:#3b0764;">GSK</span><span style="font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:4px;background:linear-gradient(118deg,#8B3DAB,#5B1D7B);color:#fff;letter-spacing:0.1em;">AUGMENTIN</span></div>

    <!-- Main copy -->
    <div class="flex-1 flex flex-col justify-center max-w-[560px] py-8">

      <p class="eyebrow text-[#8B3DAB] font-semibold text-sm sm:text-[15px] mb-[1.15em]">AI PATIENT SIMULATOR</p>

      <h1 class="text-[#0a1030] font-semibold tracking-[-0.01em] leading-[1.16]
                 text-[2.35rem] sm:text-[3rem] lg:text-[3.45rem]">
        Welcome to the<br>Augmentin Case<br>Simulation
      </h1>

      <p class="mt-[1.35em] text-[#232c47] text-[1.06rem] sm:text-[1.2rem] leading-[1.55] max-w-[27ch]">
        Assess the patient. Explore the symptoms. Make your clinical decision.
      </p>

      <button onclick="window.location.href='/'" class="btn-start mt-[1.9em] w-full max-w-[500px] text-white rounded-[18px]
                     pl-9 pr-8 py-[1.05em] flex items-center justify-between gap-8">
        <span class="text-[1.7rem] sm:text-[2rem] font-medium leading-none">Start Now</span>
        <svg class="arw w-9 h-9 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
        </svg>
      </button>
    </div>

    <!-- Footer note -->
    <div class="relative z-10 flex items-center gap-4 mt-auto">
      <span class="w-[3px] h-7 bg-[#8B3DAB] rounded-full"></span>
      <span class="text-[#232c47] text-[1rem]">An interactive clinical case experience</span>
    </div>
  </div>

  <!-- ================= RIGHT ================= -->
  <div class="relative w-full lg:w-[52vw] lg:h-screen shrink-0 overflow-hidden flex justify-end items-center">
    <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:2rem;font-weight:900;letter-spacing:0.04em;color:#3b0764;">GSK</span><span style="font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:4px;background:linear-gradient(118deg,#8B3DAB,#5B1D7B);color:#fff;letter-spacing:0.1em;">AUGMENTIN</span></div>
  </div>

  <!-- decorative line-work: bottom band only, never crosses the button -->
  <svg class="waves pointer-events-none absolute left-0 bottom-0 w-[62%] h-[17vh] z-0"
       viewBox="0 0 900 170" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20 34 C170 -14 430 74 650 22 S 880 -6 940 20"/>
    <path d="M-20 62 C170 14 430 102 650 50 S 880 22 940 48"/>
    <path d="M-20 90 C170 42 430 130 650 78 S 880 50 940 76"/>
    <path d="M-20 118 C170 70 430 158 650 106 S 880 78 940 104"/>
    <path d="M-20 146 C170 98 430 186 650 134 S 880 106 940 132"/>
  </svg>

</div>

</body>
</html>
